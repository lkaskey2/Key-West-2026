<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Key West Getaway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600&display=swap');

  :root{
    --sand: #FDF6EC;
    --sand-deep: #FBEBD3;
    --coral: #E8694A;
    --coral-soft: #F3A98F;
    --teal: #1D8A8A;
    --teal-deep: #0F5C5C;
    --hibiscus: #E24E80;
    --sky: #4FB3C9;
    --ink: #2E3A3A;
    --ink-soft: #6E8080;
    --card: #FFFDF8;
    --line: rgba(46,58,58,0.12);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }

  body{
    background: var(--sand);
    background-image:
      radial-gradient(circle at 6% 8%, rgba(79,179,201,0.18), transparent 32%),
      radial-gradient(circle at 94% 88%, rgba(232,105,74,0.14), transparent 36%);
    font-family: 'Karla', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    -webkit-user-select:none;
  }

  .phone{
    width:100%;
    max-width:460px;
    height:100dvh;
    max-height:900px;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .pages{ flex:1; position:relative; overflow:hidden; }

  .page{
    position:absolute;
    inset:0;
    padding: 26px 18px 96px;
    overflow-y:auto;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.28s ease;
    -webkit-overflow-scrolling:touch;
  }
  .page.active{ opacity:1; pointer-events:auto; }

  .progress{
    display:flex; justify-content:center; gap:6px;
    padding: 14px 0 4px; flex-shrink:0;
  }
  .progress .seg{
    width:20px; height:3px; border-radius:2px;
    background: var(--line);
    transition: background 0.2s ease;
  }
  .progress .seg.done{ background: var(--coral-soft); }
  .progress .seg.on{ background: var(--coral); }

  /* ---------- COVER ---------- */
  .cover-card{
    background: var(--card);
    border-radius: 22px;
    padding: 22px 22px 26px;
    box-shadow: 0 14px 34px rgba(46,58,58,0.14), 0 2px 6px rgba(46,58,58,0.08);
    position:relative;
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .cover-card::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 90% 6%, rgba(79,179,201,0.20), transparent 30%),
      radial-gradient(circle at 4% 92%, rgba(232,105,74,0.16), transparent 28%);
    pointer-events:none;
  }
  .photo-frame{
    border-radius: 16px;
    overflow:hidden;
    border: 6px solid #fff;
    box-shadow: 0 6px 18px rgba(46,58,58,0.20);
  }
  .photo-frame img{ display:block; width:100%; height:auto; }

  .eyebrow{
    margin-top:20px;
    text-align:center;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--teal-deep);
    font-weight:700;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:34px;
    line-height:1.08;
    text-align:center;
    color: var(--coral);
    margin-top:8px;
    letter-spacing:-0.01em;
  }
  .subdate{
    text-align:center;
    margin-top:8px;
    font-size:15px;
    color: var(--ink-soft);
    font-weight:500;
  }
  .chips{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .chip{
    background: var(--sand-deep);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    color: var(--ink);
  }
  .tap-hint{
    text-align:center;
    margin-top:22px;
    font-size:12px;
    color: var(--ink-soft);
    letter-spacing:0.03em;
  }

  .section-label{ margin: 0 4px 12px; display:flex; align-items:center; gap:10px; }
  .section-label .dot{ width:7px; height:7px; border-radius:50%; background: var(--coral); flex-shrink:0; }
  .section-label span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--ink-soft);
  }

  /* ---------- TRIP DETAILS CARD ---------- */
  .travel-card{
    background: var(--card);
    border-radius: 18px;
    border:1px solid var(--line);
    box-shadow: 0 6px 18px rgba(46,58,58,0.08);
    overflow:hidden;
  }
  .flight-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 16px 18px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .flight-row:active{ background: var(--sand-deep); }
  .flight-row + .flight-row{ border-top: 1px solid var(--line); }
  .flight-left{ display:flex; gap:12px; align-items:flex-start; }
  .flight-icon{
    width:36px; height:36px; border-radius:10px;
    background: var(--sand-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; flex-shrink:0;
  }
  .flight-name{ font-weight:600; font-size:14.5px; color:var(--ink); }
  .flight-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .flight-date{
    font-size:12.5px; font-weight:600; color: var(--coral);
    text-align:right; white-space:nowrap;
  }

  /* ---------- DAY CARD ---------- */
  .day-hero{ text-align:center; margin-bottom:20px; }
  .day-hero .eyebrow{ margin-top:0; }
  .day-hero .day-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    color: var(--ink);
    margin-top:6px;
  }
  .day-hero .day-date{ font-size:14px; color: var(--ink-soft); margin-top:4px; font-weight:500; }
  .day-badge{
    display:inline-block;
    margin-top:10px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding: 4px 12px;
    border-radius:999px;
  }
  .badge-arrival{ background: rgba(79,179,201,0.22); color: var(--teal-deep); }
  .badge-departure{ background: rgba(232,105,74,0.18); color: var(--coral); }

  .day-card{
    background: var(--card);
    border-radius: 18px;
    border:1px solid var(--line);
    box-shadow: 0 6px 18px rgba(46,58,58,0.08);
    overflow:hidden;
  }
  .event-list{ padding: 8px 8px 4px; }
  .event{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 10px; cursor:pointer;
    border-radius:12px;
    transition: background 0.15s ease;
  }
  .event:active{ background: var(--sand-deep); }
  .event + .event{ border-top:1px solid var(--line); }
  .event-time{ width:52px; flex-shrink:0; font-size:11.5px; font-weight:700; color: var(--teal); padding-top:2px; }
  .event-icon{ font-size:18px; flex-shrink:0; padding-top:1px; }
  .event-body{ flex:1; }
  .event-title{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .event-note{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .add-event-row{
    display:flex; align-items:center; gap:10px;
    padding:13px 10px; cursor:pointer;
    border-top:1px solid var(--line);
    color: var(--coral); font-weight:700; font-size:13.5px;
  }
  .add-event-row .plus-circle{
    width:22px; height:22px; border-radius:50%;
    border:1.5px dashed var(--coral);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex-shrink:0;
  }

  .day-hint{ text-align:center; margin-top:12px; font-size:11.5px; font-weight:700; color:#000; }

  .empty-state{ padding: 26px 18px 8px; text-align:center; color: var(--ink-soft); font-size:13px; }

  .footer-note{ text-align:center; margin-top: 26px; font-size:12px; color: var(--ink-soft); line-height:1.6; }

  /* ---------- NAV BAR ---------- */
  .navbar{
    position:absolute; left:0; right:0;
    bottom: max(14px, env(safe-area-inset-bottom));
    height:44px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 20px; z-index:5; pointer-events:none;
  }
  .navbar::before{
    content:"";
    position:absolute; left:0; right:0; bottom:-14px; height:80px;
    background: linear-gradient(to top, var(--sand) 60%, rgba(253,246,236,0));
    z-index:-1; pointer-events:none;
  }
  .nav-btn{
    font-family:'Karla', sans-serif; font-weight:700; font-size:13px;
    letter-spacing:0.04em; color: var(--coral);
    background:none; border:none; padding: 10px 6px; cursor:pointer;
    display:flex; align-items:center; gap:5px;
    transition: opacity 0.2s ease; pointer-events:auto;
  }
  .nav-btn:disabled{ opacity:0; pointer-events:none; }
  .nav-btn .arrow{ font-size:15px; line-height:1; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(46,58,58,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; opacity:0; pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{
    width:100%; max-width:460px;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s ease;
    max-height:82vh; overflow-y:auto;
  }
  .modal-overlay.open .modal-sheet{ transform: translateY(0); }
  .modal-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:19px;
    color: var(--ink); margin-bottom:16px; text-align:center;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:11.5px; font-weight:700;
    letter-spacing:0.05em; text-transform:uppercase;
    color: var(--ink-soft); margin-bottom:6px;
  }
  .field input[type="text"], .field input[type="time"], .field textarea{
    width:100%; background: var(--sand-deep); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px;
    font-family:'Karla', sans-serif; font-size:14.5px; color: var(--ink);
    -webkit-user-select:text; user-select:text;
  }
  .field textarea{ resize:none; height:56px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .emoji-field input{ text-align:center; font-size:18px; }

  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none;
    font-family:'Karla', sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-save{ background: var(--coral); color:#fff; }
  .btn-cancel{ background: var(--sand-deep); color: var(--ink); }
  .btn-delete{
    width:100%; margin-top:10px; padding:12px; border-radius:12px;
    border:1px solid var(--line); background:none; color:#B5433A;
    font-family:'Karla', sans-serif; font-weight:700; font-size:13.5px; cursor:pointer;
  }
</style>
</head>

</div>

<script>
  /* ---------------- DATA ---------------- */
  let uidCounter = 1;
  function uid(){ return uidCounter++; }

  const days = [
    {
      weekday: 'Thursday', date: 'September 24, 2026', badge: 'arrival', badgeLabel: 'Arrival Day',
      events: []
    },
    {
      weekday: 'Friday', date: 'September 25, 2026', badge: null, badgeLabel: '',
      events: [
        { id: uid(), time: '19:30', icon: '🍹', title: "Dinner at Santiago's Bodega", note: '207 Petronia Street, Key West, FL' }
      ]
    },
    {
      weekday: 'Saturday', date: 'September 26, 2026', badge: null, badgeLabel: '',
      events: []
    },
    {
      weekday: 'Sunday', date: 'September 27, 2026', badge: 'departure', badgeLabel: 'Departure Day',
      events: []
    }
  ];

  const travel = {
    arrival: { label: 'Arrival', date: 'Sept 24, 2026', flightNumber: '', depart: '', arrive: '', note: '' },
    departure: { label: 'Departure', date: 'Sept 27, 2026', flightNumber: '', depart: '', arrive: '', note: '' }
  };

  /* ---------------- TIME HELPERS ---------------- */
  function formatTime(t){
    if (!t) return '';
    const [hStr, mStr] = t.split(':');
    let h = parseInt(hStr, 10);
    const m = mStr;
    const ampm = h >= 12 ? 'p' : 'a';
    h = h % 12;
    if (h === 0) h = 12;
    return (m === '00') ? (h + ampm) : (h + ':' + m + ampm);
  }

  function sortEvents(events){
    return events.slice().sort((a, b) => {
      const at = a.time || '99:99';
      const bt = b.time || '99:99';
      if (at === bt) return 0;
      return at < bt ? -1 : 1;
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  /* ---------------- RENDER DAY PAGES ---------------- */
  function renderDay(dayIdx){
    const day = days[dayIdx];
    const pageEl = document.querySelector('.page[data-day="' + dayIdx + '"]');
    const dayNum = dayIdx + 1;

    let badgeHtml = '';
    if (day.badge === 'arrival') badgeHtml = '<div class="day-badge badge-arrival">' + day.badgeLabel + '</div>';
    if (day.badge === 'departure') badgeHtml = '<div class="day-badge badge-departure">' + day.badgeLabel + '</div>';

    let eventsHtml = '';
    const sorted = sortEvents(day.events);
    if (sorted.length === 0){
      eventsHtml = '<div class="empty-state">No events yet &mdash; tap below to add the first one</div>';
    } else {
      eventsHtml = sorted.map(ev => {
        const timeLabel = ev.time ? formatTime(ev.time) : '';
        const noteHtml = ev.note ? '<div class="event-note">' + escapeHtml(ev.note) + '</div>' : '';
        return '<div class="event" data-event-id="' + ev.id + '" data-day-idx="' + dayIdx + '">' +
          '<div class="event-time">' + timeLabel + '</div>' +
          '<div class="event-icon">' + (ev.icon || '📌') + '</div>' +
          '<div class="event-body"><div class="event-title">' + escapeHtml(ev.title) + '</div>' + noteHtml + '</div>' +
        '</div>';
      }).join('');
    }

    pageEl.innerHTML =
      '<div class="day-hero">' +
        '<div class="eyebrow">Day ' + dayNum + ' of ' + days.length + '</div>' +
        '<div class="day-title">' + day.weekday + '</div>' +
        '<div class="day-date">' + day.date + '</div>' +
        badgeHtml +
      '</div>' +
      '<div class="day-card">' +
        '<div class="event-list">' + eventsHtml + '</div>' +
        '<div class="add-event-row" data-day-idx="' + dayIdx + '">' +
          '<div class="plus-circle">+</div> Add an event' +
        '</div>' +
      '</div>' +
      '<div class="day-hint">Tap an event to edit &middot; tap + to add</div>';

    pageEl.querySelectorAll('.event').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openModal(parseInt(el.dataset.dayIdx), parseInt(el.dataset.eventId));
      });
    });
    pageEl.querySelector('.add-event-row').addEventListener('click', (e) => {
      e.stopPropagation();
      openModal(parseInt(e.currentTarget.dataset.dayIdx), null);
    });
  }

  function renderAllDays(){
    days.forEach((_, i) => renderDay(i));
  }

  /* ---------------- RENDER TRIP DETAILS CARD ---------------- */
  function renderTravel(){
    const card = document.getElementById('travelCard');
    const rows = ['arrival', 'departure'].map(key => {
      const t = travel[key];
      const icon = key === 'arrival' ? '🚗' : '🚙';
      let sub;
      if (!t.flightNumber && !t.depart && !t.note){
        sub = 'Tap to add details';
      } else {
        const parts = [];
        if (t.flightNumber) parts.push(escapeHtml(t.flightNumber));
        if (t.depart) parts.push(formatTime(t.depart));
        if (t.note) parts.push(escapeHtml(t.note));
        sub = parts.join(' &middot; ');
      }
      return '<div class="flight-row" data-flight="' + key + '">' +
        '<div class="flight-left">' +
          '<div class="flight-icon">' + icon + '</div>' +
          '<div>' +
            '<div class="flight-name">' + t.label + '</div>' +
            '<div class="flight-sub">' + sub + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flight-date">' + t.date + '</div>' +
      '</div>';
    }).join('');
    card.innerHTML = rows;

    card.querySelectorAll('.flight-row').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openFlightModal(el.dataset.flight);
      });
    });
  }

  /* ---------------- EVENT MODAL ---------------- */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const fEmoji = document.getElementById('fEmoji');
  const fTime = document.getElementById('fTime');
  const fTitle = document.getElementById('fTitle');
  const fNote = document.getElementById('fNote');
  const btnSave = document.getElementById('btnSave');
  const btnCancel = document.getElementById('btnCancel');
  const btnDelete = document.getElementById('btnDelete');

  let editingDayIdx = null;
  let editingEventId = null;

  function openModal(dayIdx, eventId){
    editingDayIdx = dayIdx;
    editingEventId = eventId;

    if (eventId === null){
      modalTitle.textContent = 'Add Event';
      fEmoji.value = '';
      fTime.value = '';
      fTitle.value = '';
      fNote.value = '';
      btnDelete.style.display = 'none';
    } else {
      const ev = days[dayIdx].events.find(e => e.id === eventId);
      modalTitle.textContent = 'Edit Event';
      fEmoji.value = ev.icon || '';
      fTime.value = ev.time || '';
      fTitle.value = ev.title || '';
      fNote.value = ev.note || '';
      btnDelete.style.display = 'block';
    }
    modalOverlay.classList.add('open');
  }

  function closeModal(){
    modalOverlay.classList.remove('open');
    editingDayIdx = null;
    editingEventId = null;
  }

  btnCancel.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
  modalOverlay.addEventListener('click', () => closeModal());

  btnSave.addEventListener('click', (e) => {
    e.stopPropagation();
    const title = fTitle.value.trim();
    if (!title){ fTitle.focus(); return; }

    const data = {
      icon: fEmoji.value.trim() || '📌',
      time: fTime.value || '',
      title: title,
      note: fNote.value.trim()
    };

    if (editingEventId === null){
      days[editingDayIdx].events.push(Object.assign({ id: uid() }, data));
    } else {
      const ev = days[editingDayIdx].events.find(e => e.id === editingEventId);
      Object.assign(ev, data);
    }
    renderDay(editingDayIdx);
    closeModal();
  });

  btnDelete.addEventListener('click', (e) => {
    e.stopPropagation();
    if (editingEventId !== null){
      days[editingDayIdx].events = days[editingDayIdx].events.filter(e => e.id !== editingEventId);
      renderDay(editingDayIdx);
    }
    closeModal();
  });

  /* ---------------- TRIP DETAIL MODAL ---------------- */
  const flightModalOverlay = document.getElementById('flightModalOverlay');
  const flightModalTitle = document.getElementById('flightModalTitle');
  const flNumber = document.getElementById('flNumber');
  const flDepart = document.getElementById('flDepart');
  const flNote = document.getElementById('flNote');
  const flBtnSave = document.getElementById('flBtnSave');
  const flBtnCancel = document.getElementById('flBtnCancel');

  let editingFlightKey = null;

  function openFlightModal(key){
    editingFlightKey = key;
    const t = travel[key];
    flightModalTitle.textContent = 'Edit ' + t.label + ' Details';
    flNumber.value = t.flightNumber || '';
    flDepart.value = t.depart || '';
    flNote.value = t.note || '';
    flightModalOverlay.classList.add('open');
  }

  function closeFlightModal(){
    flightModalOverlay.classList.remove('open');
    editingFlightKey = null;
  }

  flBtnCancel.addEventListener('click', (e) => { e.stopPropagation(); closeFlightModal(); });
  flightModalOverlay.addEventListener('click', () => closeFlightModal());

  flBtnSave.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!editingFlightKey) return;
    const t = travel[editingFlightKey];
    t.flightNumber = flNumber.value.trim();
    t.depart = flDepart.value || '';
    t.note = flNote.value.trim();
    renderTravel();
    closeFlightModal();
  });

  /* ---------------- PAGE NAVIGATION ---------------- */
  const pages = Array.from(document.querySelectorAll('.page'));
  const total = pages.length;
  let current = 0;

  const progressEl = document.getElementById('progress');
  pages.forEach(() => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    progressEl.appendChild(seg);
  });
  const segs = Array.from(progressEl.children);

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function render(){
    pages.forEach((p, i) => p.classList.toggle('active', i === current));
    segs.forEach((s, i) => {
      s.classList.toggle('on', i === current);
      s.classList.toggle('done', i < current);
    });
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
    pages[current].scrollTop = 0;
  }

  function goNext(){ if (current < total - 1){ current++; render(); } }
  function goPrev(){ if (current > 0){ current--; render(); } }

  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goNext(); });

  document.getElementById('phone').addEventListener('click', (e) => {
    if (e.target.closest('.nav-btn')) return;
    if (e.target.closest('.event')) return;
    if (e.target.closest('.add-event-row')) return;
    if (e.target.closest('.flight-row')) return;
    if (modalOverlay.classList.contains('open')) return;
    if (flightModalOverlay.classList.contains('open')) return;
    goNext();
  });

  renderAllDays();
  renderTravel();
  render();
</script>
</body>
</html>
